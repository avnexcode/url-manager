name: url-manager

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: avnexcode
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', (r) => { if
          (r.statusCode !== 200) throw new Error(r.statusCode) })",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
