# sudo apt install -y nginx certbot python3-certbot-nginx
# Buat config nginx baru
# sudo nano /etc/nginx/sites-available/mfn-aziz.site
# -> Input config dibawah
server {
    listen 80;
    server_name mfn-aziz.site www.mfn-aziz.site;
    large_client_header_buffers 4 16k;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Aktifkan config
# sudo ln -s /etc/nginx/sites-available/mfn-aziz.site /etc/nginx/sites-enabled/
# sudo rm -f /etc/nginx/sites-enabled/default

# 3. Test dan start nginx
# sudo nginx -t
# sudo systemctl start nginx / sudo systemctl reload nginx

# 4. Generate certificate
# sudo certbot --nginx -d mfn-aziz.site -d www.mfn-aziz.site
